name: push-master

on:
  push:
    branches: [ "master" ]

jobs:
  build:
    runs-on: windows-2022
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup MSVC
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x64

      - name: Run CMake
        run: |
          cmake --preset windows-release --fresh
          cmake --build --preset release

      - name: Move "latest" tag to this commit
        shell: pwsh
        run: |
          git tag -f latest $env:GITHUB_SHA
          git push -f origin refs/tags/latest

      - name: Publish release
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          artifactErrorsFailBuild: true
          omitBody: true
          commit: ${{ github.sha }}
          tag: 'latest'
          artifacts: 'cmake-build-release/vsync-tool.exe'
